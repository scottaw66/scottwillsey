{% set path = current_path or "/" %}
{% set path_parts = path | split(pat="/") %}
{% set area = path_parts[1] %}
<div class="masthead">
  <div class="site-identity">
    <a href="/" class="site-wordmark" aria-label="Scott Willsey home">
      <span>sc</span>
      <span class="title-image">
        {% set av = resize_image(path="src/assets/images/saw111.jpg", width=100, op="fit_width", format="webp", quality=80) %}
        <img src="/{{ av.static_path | split(pat="static/") | last }}" width="{{ av.width }}" height="{{ av.height }}" alt="" />
      </span>
      <span>ttwillsey</span>
    </a>
    <span class="site-sticker font-title-nihongo">新無料サイト!!</span>
  </div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/" aria-label="Home" {% if path == "/" %}aria-current="page"{% endif %}>
      {{<menu_home_icon size="1.6rem" fill="currentColor" />}}
    </a>
    <a href="/1" {% if page is defined and (page.extra?.page_num or page.extra?.display_title) and area != "reads" and area != "reviews" %}aria-current="page"{% endif %}>blog</a>
    <a href="/links" {% if area == "links" %}aria-current="page"{% endif %}>links</a>
    <a href="/now" {% if area == "now" %}aria-current="page"{% endif %}>/now</a>
    <a href="/reviews" {% if area == "reviews" %}aria-current="page"{% endif %}>reviews</a>
    <a href="/about" {% if area == "about" %}aria-current="page"{% endif %}>about</a>
  </nav>
</div>
