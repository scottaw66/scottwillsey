<div
  class="max-w-[90ch] mx-auto my-0 p-8 flex flex-col items-center content-center justify-center"
>
  <div class="flex flex-row gap-1 mb-1 items-center">
    <a href="{{ config.extra.bluesky }}">{{<bluesky_icon size="1.8rem" fill="var(--accent-blue)" />}}</a>
    <a href="{{ config.extra.mastodon }}">{{<mastodon_icon size="2rem" fill="var(--accent-purple)" />}}</a>
    <a href="{{ config.extra.github }}">{{<github_icon size="2rem" />}}</a>
    <a href="/rss.xml">{{<rss_icon size="2.4rem" fill="var(--accent-orange-darker)" />}}</a>
  </div>
  <div class="text-[0.6rem] font-bold p-0 m-0">
    &copy; {{ now() | date(format="%Y") }}&nbsp;{{ config.extra.author }}
  </div>
</div>
